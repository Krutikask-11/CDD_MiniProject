name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI_TEST: mongodb://localhost:27017/hostel_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (main only)
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push on main) backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hostel-api:latest
      - name: Build (and push on main) frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hostel-frontend:latest
