# MongoDB stays on Atlas. Put MONGODB_URI and JWT_SECRET in a .env file next to
# this file (docker compose reads it automatically) or export them in your shell.
#backend-Node.js
services:
  api:
    build: ./backend
      ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
